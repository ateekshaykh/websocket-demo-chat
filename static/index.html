<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#05060f" />
<title>WebSocket Chat</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --canvas: #05060f;
    --canvas-subtle: #0a0c1c;
    --canvas-inset: #030410;

    --glass: rgba(255, 255, 255, 0.055);
    --glass-strong: rgba(255, 255, 255, 0.09);
    --glass-border: rgba(255, 255, 255, 0.11);
    --glass-border-strong: rgba(255, 255, 255, 0.2);

    --fg: #eef1fb;
    --fg-muted: #9aa3c0;
    --fg-subtle: #6b7394;

    --accent: #22d3ee;
    --accent-2: #a78bfa;
    --accent-3: #f472b6;
    --accent-emphasis: #06b6d4;

    --success: #34d399;
    --success-emphasis: #10b981;
    --danger: #fb7185;
    --danger-strong: #f43f5e;
    --attention: #fbbf24;

    --radius: 16px;
    --radius-sm: 10px;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --display: "Space Grotesk", var(--sans);

    --glow-cyan: 0 0 24px rgba(34, 211, 238, 0.35);
    --glow-violet: 0 0 24px rgba(167, 139, 250, 0.3);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--canvas);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 16px;
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  /* ---------- Ambient aurora background ---------- */
  .aurora {
    position: fixed;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .aurora span {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    will-change: transform;
  }
  .aurora span.a1 {
    width: 46vmax; height: 46vmax;
    top: -14vmax; left: -12vmax;
    background: radial-gradient(circle at 30% 30%, #22d3ee, transparent 70%);
    animation: drift1 22s ease-in-out infinite;
  }
  .aurora span.a2 {
    width: 40vmax; height: 40vmax;
    bottom: -16vmax; right: -10vmax;
    background: radial-gradient(circle at 60% 60%, #a78bfa, transparent 70%);
    animation: drift2 26s ease-in-out infinite;
  }
  .aurora span.a3 {
    width: 32vmax; height: 32vmax;
    bottom: 8vmax; left: 8vmax;
    background: radial-gradient(circle at 50% 50%, #f472b6, transparent 70%);
    opacity: 0.35;
    animation: drift3 30s ease-in-out infinite;
  }
  .grid-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 90%);
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(6vmax, 8vmax) scale(1.12); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-7vmax, -5vmax) scale(1.08); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(4vmax, -6vmax) scale(1.15); }
  }

  @media (prefers-reduced-motion: reduce) {
    .aurora span { animation: none !important; }
  }

  /* ---------- App shell ---------- */
  #app-shell {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
  }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.85rem 1rem;
    padding-top: max(0.85rem, env(safe-area-inset-top));
    border-bottom: 1px solid var(--glass-border);
    background: rgba(10, 12, 28, 0.55);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
  }

  .brand-mark {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 8px rgba(34,211,238,.5));
  }
  .brand-mark svg { width: 100%; height: 100%; display: block; }

  header h1 {
    font-family: var(--display);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  header h1 .room-name {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--fg-subtle);
    flex: 0 0 auto;
    box-shadow: 0 0 0 4px transparent;
    transition: background .2s, box-shadow .2s;
  }
  .status-dot.connecting { background: var(--attention); box-shadow: 0 0 0 4px rgba(251,191,36,.18), 0 0 10px rgba(251,191,36,.6); animation: pulse 1s infinite; }
  .status-dot.open { background: var(--success); box-shadow: 0 0 0 4px rgba(52,211,153,.18), 0 0 10px rgba(52,211,153,.7); }
  .status-dot.closed { background: var(--danger); box-shadow: 0 0 0 4px rgba(251,113,133,.18), 0 0 10px rgba(251,113,133,.6); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- Header icon / action buttons ---------- */
  .icon-btn {
    position: relative;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--fg-muted);
    border-radius: var(--radius-sm);
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
    white-space: nowrap;
    backdrop-filter: blur(8px);
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  }
  .icon-btn svg {
    width: 17px;
    height: 17px;
    display: block;
    flex: 0 0 auto;
    stroke: currentColor;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--glass-border-strong); box-shadow: 0 0 14px rgba(34,211,238,.18); }
  .icon-btn:active { background: var(--glass-strong); }

  .online-btn { display: none; }
  .online-btn.show { display: inline-flex; }
  .count-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 16px;
    height: 16px;
    padding: 0 3px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #06101a;
    font-family: var(--display);
    font-size: 0.62rem;
    font-weight: 700;
    line-height: 16px;
    text-align: center;
    box-shadow: 0 0 0 2px var(--canvas-subtle);
  }
  .count-badge[hidden] { display: none; }

  .leave-btn {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    background: linear-gradient(135deg, rgba(251,113,133,0.14), rgba(244,63,94,0.05));
    border: 1px solid rgba(251,113,133,0.4);
    color: var(--danger);
    border-radius: 999px;
    height: 36px;
    padding: 0 0.9rem;
    font-family: var(--sans);
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    flex: 0 0 auto;
    backdrop-filter: blur(10px);
    transition: background .15s, box-shadow .15s, border-color .15s, transform .1s;
  }
  .leave-btn.show { display: inline-flex; }
  .leave-btn svg { width: 15px; height: 15px; flex: 0 0 auto; stroke: currentColor; }
  .leave-btn:hover { border-color: rgba(251,113,133,.8); box-shadow: 0 0 18px rgba(251,113,133,.4); color: #ffd7dd; }
  .leave-btn:active { transform: scale(.95); background: rgba(251,113,133,.22); }

  @media (max-width: 380px) {
    .leave-btn { width: 36px; padding: 0; border-radius: var(--radius-sm); }
    .leave-btn .btn-label { display: none; }
  }

  /* ---------- Reconnect banner ---------- */
  #reconnect-banner {
    flex: 0 0 auto;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height .25s ease, opacity .2s ease;
  }
  #reconnect-banner.show { max-height: 60px; opacity: 1; }
  .reconnect-inner {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 1rem;
    background: linear-gradient(135deg, rgba(251,191,36,0.16), rgba(251,191,36,0.05));
    border-bottom: 1px solid rgba(251,191,36,0.35);
    font-size: 0.8rem;
    color: var(--attention);
  }
  .reconnect-spinner {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid rgba(251,191,36,.35);
    border-top-color: var(--attention);
    animation: spin .8s linear infinite;
    flex: 0 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .reconnect-spinner { animation: none; }
  }
  #reconnect-text { flex: 1; min-width: 0; }
  .reconnect-retry-btn {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid rgba(251,191,36,.5);
    color: var(--attention);
    border-radius: 999px;
    padding: 0.25rem 0.7rem;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }
  .reconnect-retry-btn:active { background: rgba(251,191,36,.15); }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Join screen ---------- */
  #join-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
  }

  .join-card {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: 1.75rem 1.6rem;
    border-radius: 20px;
    background: linear-gradient(180deg, var(--glass-strong), var(--glass));
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }

  #join-screen h1 {
    font-family: var(--display);
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 0.3rem;
    background: linear-gradient(90deg, var(--fg), var(--accent-2) 120%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #join-screen p.lede { color: var(--fg-muted); font-size: 0.88rem; margin: 0; line-height: 1.5; }

  .field { display: flex; flex-direction: column; gap: 0.4rem; }
  .field label {
    font-size: 0.72rem;
    color: var(--fg-subtle);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  input[type="text"] {
    background: var(--canvas-inset);
    border: 1px solid var(--glass-border);
    color: var(--fg);
    border-radius: var(--radius-sm);
    padding: 0.75rem 0.85rem;
    font-size: 16px;
    font-family: var(--sans);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]::placeholder { color: var(--fg-subtle); }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,211,238,.15), var(--glow-cyan); }

  .field-warning {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.74rem;
    color: var(--attention);
    margin: 0.1rem 0 0;
  }
  .field-warning svg { flex: 0 0 auto; }
  .field-warning[hidden] { display: none; }

  button.primary {
    position: relative;
    background: linear-gradient(90deg, var(--accent-emphasis), var(--accent-2));
    border: none;
    color: #06101a;
    border-radius: var(--radius-sm);
    padding: 0.8rem 1rem;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: var(--display);
    letter-spacing: 0.01em;
    cursor: pointer;
    margin-top: 0.4rem;
    box-shadow: 0 8px 24px rgba(34, 211, 238, .25);
    transition: transform .1s, box-shadow .15s, filter .15s;
  }
  button.primary:hover { filter: brightness(1.08); box-shadow: 0 10px 30px rgba(34, 211, 238, .35); }
  button.primary:active { transform: translateY(1px) scale(.99); }

  /* ---------- Chat screen ---------- */
  #chat-screen {
    flex: 1;
    min-height: 0;
    display: none;
    flex-direction: column;
  }

  .log-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

  #log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0.9rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--glass-border-strong); border-radius: 8px; }
  #log::-webkit-scrollbar-track { background: transparent; }

  .jump-latest-btn {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    display: none;
    align-items: center;
    gap: 0.4rem;
    background: rgba(10, 12, 28, 0.88);
    border: 1px solid var(--glass-border-strong);
    color: var(--fg);
    border-radius: 999px;
    padding: 0.4rem 0.85rem;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    opacity: 0;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 3;
  }
  .jump-latest-btn.show { display: inline-flex; opacity: 1; transform: translateX(-50%) translateY(0); }
  .jump-latest-btn .count {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #06101a;
    border-radius: 999px;
    min-width: 18px;
    height: 18px;
    font-size: 0.66rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }
  .jump-latest-btn .count:empty { display: none; }

  .day-divider {
    align-self: center;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin: 0.3rem 0;
    font-family: var(--mono);
    font-size: 0.66rem;
    color: var(--fg-subtle);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .day-divider::before, .day-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--glass-border);
  }

  .msg { max-width: 85%; display: flex; flex-direction: column; gap: 0.2rem; animation: rise .22s ease-out; }
  .msg.grouped { margin-top: -6px; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg .bubble {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-left-width: 3px;
    border-radius: var(--radius);
    padding: 0.55rem 0.8rem;
    font-size: 0.92rem;
    line-height: 1.45;
    word-wrap: break-word;
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
  }
  .msg .who {
    font-size: 0.71rem;
    font-weight: 700;
    padding: 0 0.2rem;
    display: inline-block;
    width: fit-content;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }
  .msg .meta {
    font-size: 0.65rem;
    color: var(--fg-subtle);
    padding: 0 0.25rem;
    font-family: var(--mono);
  }
  .msg.me { align-self: flex-end; }
  .msg.me .bubble { border-left-width: 1px; border-right-width: 3px; }
  .msg.me .meta { text-align: right; }
  .msg.system { align-self: center; max-width: 95%; }
  .msg.system .bubble {
    background: rgba(255,255,255,0.03);
    border: 1px dashed var(--glass-border);
    color: var(--fg-subtle);
    font-size: 0.76rem;
    font-family: var(--mono);
    text-align: center;
    padding: 0.3rem 0.7rem;
    box-shadow: none;
  }

  /* Incoming ("them") messages get an avatar beside a column of who/bubble/meta. */
  .msg.them { flex-direction: row; align-items: flex-end; gap: 0.5rem; }
  .msg.them .msg-col { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .avatar-slot { width: 30px; flex: 0 0 auto; }
  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.68rem;
    color: #06101a;
  }

  /* ---------- Reactions ---------- */
  .bubble-wrap { position: relative; display: inline-flex; max-width: 100%; }
  .react-trigger {
    position: absolute;
    bottom: -8px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--canvas-subtle);
    border: 1px solid var(--glass-border);
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.55;
    transition: opacity .15s, transform .1s;
  }
  .msg.them .react-trigger { right: -8px; }
  .msg.me .react-trigger { left: -8px; }
  .react-trigger:hover, .react-trigger:focus-visible { opacity: 1; transform: scale(1.1); }

  .reaction-picker {
    position: absolute;
    bottom: 100%;
    margin-bottom: 6px;
    display: flex;
    gap: 2px;
    padding: 0.3rem;
    background: rgba(10, 12, 28, 0.92);
    border: 1px solid var(--glass-border-strong);
    border-radius: 999px;
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    z-index: 5;
  }
  .msg.them .reaction-picker { right: 0; }
  .msg.me .reaction-picker { left: 0; }
  .reaction-picker button {
    background: transparent;
    border: none;
    font-size: 1.05rem;
    line-height: 1;
    padding: 0.28rem;
    border-radius: 50%;
    cursor: pointer;
    transition: background .1s, transform .1s;
  }
  .reaction-picker button:hover { background: var(--glass-strong); transform: scale(1.18); }

  .reactions { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .reactions:empty { display: none; }
  .reaction-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 0.1rem 0.5rem;
    font-size: 0.74rem;
    color: var(--fg-muted);
    cursor: pointer;
  }
  .reaction-pill.mine { border-color: var(--accent); background: rgba(34,211,238,0.14); color: var(--fg); }

  /* ---------- Message formatting: links + code ---------- */
  .bubble a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
    word-break: break-all;
  }
  .bubble a:hover { color: var(--accent-2); }
  .bubble .inline-code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-border);
    border-radius: 4px;
    padding: 0.05em 0.35em;
  }
  .bubble .code-block {
    display: block;
    margin: 0.4rem 0 0.1rem;
    padding: 0.6rem 0.7rem;
    background: var(--canvas-inset);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 0.8rem;
    line-height: 1.5;
    white-space: pre;
  }

  /* ---------- Typing indicator ---------- */
  #typing-indicator {
    flex: 0 0 auto;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    padding: 0 0.9rem;
    transition: max-height .25s ease, opacity .2s ease, padding .25s ease;
  }
  #typing-indicator.show {
    max-height: 44px;
    opacity: 1;
    padding: 0.15rem 0.9rem 0.5rem;
  }
  .typing-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 0.35rem 0.8rem;
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
  }
  .typing-text {
    font-size: 0.76rem;
    color: var(--fg-muted);
    font-style: italic;
  }
  .typing-dots { display: inline-flex; align-items: center; gap: 3px; }
  .typing-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    animation: typingBounce 1.2s infinite ease-in-out;
    box-shadow: 0 0 6px rgba(34,211,238,.6);
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .45; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  #send-row {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 0.6rem;
    padding: 0.75rem;
    padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    border-top: 1px solid var(--glass-border);
    background: rgba(10, 12, 28, 0.55);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
  }
  #message {
    flex: 1;
    background: var(--canvas-inset);
    border: 1px solid var(--glass-border);
    color: var(--fg);
    border-radius: var(--radius);
    padding: 0.65rem 1rem;
    font-size: 16px;
    font-family: var(--sans);
    line-height: 1.4;
    resize: none;
    max-height: 120px;
    overflow-y: auto;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #message::placeholder { color: var(--fg-subtle); }
  #message:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,211,238,.15); }
  #send-row button {
    flex: 0 0 auto;
    background: linear-gradient(135deg, var(--accent-emphasis), var(--accent-2));
    border: none;
    color: #06101a;
    border-radius: 999px;
    height: 42px;
    padding: 0 1.3rem;
    font-weight: 700;
    font-family: var(--display);
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(34, 211, 238, .25);
    transition: filter .15s, transform .1s;
  }
  #send-row button:hover { filter: brightness(1.08); }
  #send-row button:active { transform: scale(.97); }

  /* ---------- Connection log panel ---------- */
  #panel-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(3,4,16,.65);
    backdrop-filter: blur(2px);
    z-index: 10;
  }
  .sheet {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 82dvh;
    background: rgba(10, 12, 28, 0.85);
    backdrop-filter: blur(26px) saturate(160%);
    -webkit-backdrop-filter: blur(26px) saturate(160%);
    border-top: 1px solid var(--glass-border-strong);
    border-radius: 18px 18px 0 0;
    z-index: 11;
    flex-direction: column;
    box-shadow: 0 -12px 40px rgba(0,0,0,.5);
  }
  .sheet.show, #panel-backdrop.show { display: flex; }
  #panel-backdrop.show { display: block; }

  .sheet-handle {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--glass-border);
  }
  .sheet-handle h2 {
    font-family: var(--display);
    font-size: 0.9rem;
    margin: 0;
    color: var(--fg);
  }

  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0.9rem 1rem; }

  #event-log { font-family: var(--mono); font-size: 0.76rem; line-height: 1.7; }
  .ev { padding: 0.25rem 0; border-bottom: 1px solid var(--glass-border); display: flex; gap: 0.6rem; }
  .ev .t { color: var(--fg-subtle); flex: 0 0 auto; }
  .ev .m { flex: 1; word-break: break-word; }
  .ev.info .m { color: var(--fg-muted); }
  .ev.open .m { color: var(--success); }
  .ev.send .m { color: var(--accent); }
  .ev.recv .m { color: var(--fg); }
  .ev.error .m, .ev.close .m { color: var(--danger); }

  .sound-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    padding: 0.1rem 0 0.9rem;
    margin-bottom: 0.7rem;
    border-bottom: 1px solid var(--glass-border);
    font-size: 0.82rem;
    color: var(--fg-muted);
  }
  .sound-toggle-row .label { display: flex; align-items: center; gap: 0.5rem; }
  .sound-toggle-row svg { flex: 0 0 auto; }
  #sound-toggle {
    position: relative;
    width: 40px;
    height: 22px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--canvas-inset);
    cursor: pointer;
    flex: 0 0 auto;
    transition: background .15s, border-color .15s;
  }
  #sound-toggle::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--fg-subtle);
    transition: transform .15s, background .15s;
  }
  #sound-toggle.on { background: rgba(34,211,238,0.18); border-color: var(--accent); }
  #sound-toggle.on::after { transform: translateX(18px); background: var(--accent); }

  /* ---------- Online users panel ---------- */
  .online-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .online-item {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.5rem 0.65rem;
    border-radius: var(--radius-sm);
    background: var(--glass);
    border: 1px solid var(--glass-border);
  }
  .online-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.7rem;
    color: #06101a;
  }
  .online-name { font-size: 0.85rem; color: var(--fg); font-weight: 600; }
  .online-you {
    margin-left: auto;
    font-size: 0.68rem;
    color: var(--fg-subtle);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .online-empty { color: var(--fg-subtle); font-size: 0.85rem; text-align: center; padding: 1rem 0; }

  /* ---------- Desktop: float the shell as a card over the aurora ---------- */
  @media (min-width: 760px) {
    body { display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.5rem; }
    #app-shell {
      max-width: 640px;
      height: min(860px, 92dvh);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: 0 30px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    }
  }
</style>
</head>
<body>

  <span class="a1"></span>
  <span class="a2"></span>
  <span class="a3"></span>
</div>
<div class="grid-overlay" aria-hidden="true"></div>

    </div>
    <h1 id="header-title">WebSocket Chat</h1>
    <button id="open-online" class="icon-btn online-btn" title="Online users" aria-label="Online users">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span id="online-count-badge" class="count-badge" hidden>0</span>
    </button>
    <button id="leave-btn" class="leave-btn" title="Leave room" aria-label="Leave room">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="btn-label">Leave</span>
    </button>
    <button id="open-panel" class="icon-btn" title="Connection log" aria-label="Connection log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 12 8 12 10 6 14 18 16 12 21 12"/></svg>
    </button>
  </header>

  <div id="reconnect-banner">
    <div class="reconnect-inner">
      <span class="reconnect-spinner" aria-hidden="true"></span>
      <span id="reconnect-text">Reconnecting…</span>
      <button id="reconnect-retry" class="reconnect-retry-btn" type="button">Retry now</button>
    </div>
  </div>

  <main>
    <section id="join-screen">
      <div class="join-card">
        <div>
          <h1>Join a room</h1>
          <p class="lede">Pick a name and room. Anyone using this page or the Python client with the same room name lands in the same chat.</p>
        </div>
        <form id="join-form">
          <div class="field">
            <label for="username">Your name</label>
            <input type="text" id="username" placeholder="e.g. alice" required autocomplete="off" />
            <p id="name-taken-warning" class="field-warning" hidden>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <span id="name-taken-text"></span>
            </p>
          </div>
          <div class="field" style="margin-top:0.6rem;">
            <label for="room">Room name</label>
            <input type="text" id="room" placeholder="general" value="general" required autocomplete="off" />
          </div>
          <button type="submit" class="primary" style="width:100%;">Connect</button>
        </form>
      </div>
    </section>

    <section id="chat-screen">
      <div class="log-wrap">
        <div id="log"></div>
        <button id="jump-latest" class="jump-latest-btn" type="button">
          <span aria-hidden="true">↓</span> New messages <span id="jump-latest-count" class="count"></span>
        </button>
      </div>
      <div id="typing-indicator" aria-live="polite">
        <span class="typing-pill">
          <span class="typing-dots"><span></span><span></span><span></span></span>
          <span class="typing-text"></span>
        </span>
      </div>
      <form id="send-row">
        <textarea id="message" placeholder="Message" rows="1" autocomplete="off"></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
</div>

<div id="panel-backdrop"></div>
<div id="panel" class="sheet">
  <div class="sheet-handle">
    <h2>Connection log</h2>
    <button id="close-panel" class="icon-btn" aria-label="Close">✕</button>
  </div>
  <div class="sheet-body">
    <div class="sound-toggle-row">
      <span class="label">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        Message sound
      </span>
      <button id="sound-toggle" type="button" role="switch" aria-checked="true" aria-label="Toggle message sound"></button>
    </div>
    <div id="event-log"></div>
  </div>
</div>

<div id="online-panel" class="sheet">
  <div class="sheet-handle">
    <h2>Online — <span id="online-panel-count">0</span></h2>
    <button id="close-online-panel" class="icon-btn" aria-label="Close">✕</button>
  </div>
  <div class="sheet-body">
    <ul id="online-list" class="online-list"></ul>
  </div>
</div>

<script>
  const joinForm = document.getElementById("join-form");
  const joinScreen = document.getElementById("join-screen");
  const chatScreen = document.getElementById("chat-screen");
  const headerTitle = document.getElementById("header-title");
  const statusDot = document.getElementById("status-dot");
  const log = document.getElementById("log");
  const sendRow = document.getElementById("send-row");
  const messageInput = document.getElementById("message");
  const leaveBtn = document.getElementById("leave-btn");
  const typingIndicator = document.getElementById("typing-indicator");
  const typingTextEl = typingIndicator.querySelector(".typing-text");
  const usernameInput = document.getElementById("username");
  const roomInput = document.getElementById("room");

  const panel = document.getElementById("panel");
  const panelBackdrop = document.getElementById("panel-backdrop");
  const openPanelBtn = document.getElementById("open-panel");
  const closePanelBtn = document.getElementById("close-panel");
  const eventLogEl = document.getElementById("event-log");

  const onlineBtn = document.getElementById("open-online");
  const onlineCountBadge = document.getElementById("online-count-badge");
  const onlinePanel = document.getElementById("online-panel");
  const onlinePanelCount = document.getElementById("online-panel-count");
  const onlineListEl = document.getElementById("online-list");
  const closeOnlinePanelBtn = document.getElementById("close-online-panel");

  const reconnectBanner = document.getElementById("reconnect-banner");
  const reconnectText = document.getElementById("reconnect-text");
  const reconnectRetryBtn = document.getElementById("reconnect-retry");

  const nameTakenWarning = document.getElementById("name-taken-warning");
  const nameTakenText = document.getElementById("name-taken-text");

  const logWrap = document.querySelector(".log-wrap");
  const jumpBtn = document.getElementById("jump-latest");
  const jumpCountEl = document.getElementById("jump-latest-count");
  const soundToggleBtn = document.getElementById("sound-toggle");

  const BASE_TITLE = document.title;

  let ws = null;
  let username = "";
  let currentRoom = null;
  let leaving = false;
  let reconnectAttempts = 0;
  let reconnectTimer = null;

  // ---------- connection log helpers ----------
  function nowLabel() {
    const d = new Date();
    return d.toTimeString().split(" ")[0] + "." + String(d.getMilliseconds()).padStart(3, "0");
  }

  function logEvent(cls, text) {
    const row = document.createElement("div");
    row.className = "ev " + cls;
    row.innerHTML = `<span class="t">${nowLabel()}</span><span class="m"></span>`;
    row.querySelector(".m").textContent = text;
    eventLogEl.appendChild(row);
    eventLogEl.scrollTop = eventLogEl.scrollHeight;
  }

  function openSheet(sheetEl) {
    document.querySelectorAll(".sheet.show").forEach((s) => s.classList.remove("show"));
    sheetEl.classList.add("show");
    panelBackdrop.classList.add("show");
  }
  function closeSheets() {
    document.querySelectorAll(".sheet.show").forEach((s) => s.classList.remove("show"));
    panelBackdrop.classList.remove("show");
  }
  openPanelBtn.addEventListener("click", () => openSheet(panel));
  closePanelBtn.addEventListener("click", closeSheets);
  panelBackdrop.addEventListener("click", closeSheets);
  onlineBtn.addEventListener("click", () => openSheet(onlinePanel));
  closeOnlinePanelBtn.addEventListener("click", closeSheets);

  // ---------- chat ----------
  // A duotone "hologram" palette tuned for the dark glassmorphism theme —
  // each entry is a gradient pair rendered as gradient text on the
  // username and a matching tinted glow on that user's bubbles. Each
  // username deterministically hashes to one entry so a given name
  // always renders the same way for everyone.
  const USER_COLORS = [
    { from: "#00e5ff", to: "#2979ff", tint: "linear-gradient(135deg, rgba(0,229,255,0.16), rgba(41,121,255,0.07))", glow: "rgba(0,229,255,.3)" },
    { from: "#ff2ec4", to: "#7c3aff", tint: "linear-gradient(135deg, rgba(255,46,196,0.16), rgba(124,58,255,0.07))", glow: "rgba(255,46,196,.3)" },
    { from: "#00ffb2", to: "#00c2ff", tint: "linear-gradient(135deg, rgba(0,255,178,0.16), rgba(0,194,255,0.07))", glow: "rgba(0,255,178,.3)" },
    { from: "#ff7a18", to: "#ff2e6c", tint: "linear-gradient(135deg, rgba(255,122,24,0.16), rgba(255,46,108,0.07))", glow: "rgba(255,122,24,.3)" },
    { from: "#a3ff12", to: "#00e0b8", tint: "linear-gradient(135deg, rgba(163,255,18,0.16), rgba(0,224,184,0.07))", glow: "rgba(163,255,18,.3)" },
    { from: "#d946ef", to: "#ec4899", tint: "linear-gradient(135deg, rgba(217,70,239,0.16), rgba(236,72,153,0.07))", glow: "rgba(217,70,239,.3)" },
    { from: "#ffd60a", to: "#ff8a00", tint: "linear-gradient(135deg, rgba(255,214,10,0.16), rgba(255,138,0,0.07))", glow: "rgba(255,214,10,.3)" },
    { from: "#5eead4", to: "#818cf8", tint: "linear-gradient(135deg, rgba(94,234,212,0.16), rgba(129,140,248,0.07))", glow: "rgba(94,234,212,.3)" },
  ];

  function colorForUser(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
      hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    }
    return USER_COLORS[hash % USER_COLORS.length];
  }

  // ---------- day dividers + message grouping ----------
  // A run of consecutive messages from the same sender within this window
  // shares one name label instead of repeating it on every bubble.
  const GROUP_WINDOW_MS = 5 * 60 * 1000;
  let lastMessageDateKey = null;
  let lastRenderedMsgMeta = null; // { kind, key, atMs } | null

  function dateKeyOf(d) { return d.toDateString(); }

  function dayLabelFor(d) {
    const now = new Date();
    const startOfDay = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
    const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
    if (diffDays === 0) return "Today";
    if (diffDays === 1) return "Yesterday";
    const opts = { month: "short", day: "numeric" };
    if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
    return d.toLocaleDateString(undefined, opts);
  }

  function formatTime(d) {
    return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function maybeInsertDayDivider(isoTimestamp) {
    const d = isoTimestamp ? new Date(isoTimestamp) : new Date();
    const key = dateKeyOf(d);
    if (key === lastMessageDateKey) return;
    lastMessageDateKey = key;
    lastRenderedMsgMeta = null; // a new day divider always breaks a grouping run
    const divider = document.createElement("div");
    divider.className = "day-divider";
    divider.textContent = dayLabelFor(d);
    log.appendChild(divider);
  }

  function resetLogState() {
    lastMessageDateKey = null;
    lastRenderedMsgMeta = null;
  }

  // ---------- reactions ----------
  const QUICK_EMOJIS = ["👍", "❤️", "😂", "🎉", "😮"];
  const messageElements = new Map(); // message_id -> .msg element

  function closeAllReactionPickers() {
    document.querySelectorAll(".reaction-picker").forEach((p) => p.remove());
  }

  function sendReaction(messageId, emoji) {
    if (!ws || ws.readyState !== WebSocket.OPEN || !messageId) return;
    ws.send(JSON.stringify({ type: "reaction", message_id: messageId, emoji }));
  }

  function openReactionPicker(triggerBtn, messageId) {
    closeAllReactionPickers();
    const picker = document.createElement("div");
    picker.className = "reaction-picker";
    QUICK_EMOJIS.forEach((emoji) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = emoji;
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        sendReaction(messageId, emoji);
        closeAllReactionPickers();
      });
      picker.appendChild(b);
    });
    triggerBtn.parentElement.appendChild(picker);
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".reaction-picker") && !e.target.closest(".react-trigger")) {
      closeAllReactionPickers();
    }
  });

  function renderReactions(wrap, reactionsMap) {
    const container = wrap.querySelector(".reactions");
    if (!container) return;
    container.innerHTML = "";
    const messageId = wrap.dataset.messageId;
    Object.entries(reactionsMap || {}).forEach(([emoji, users]) => {
      if (!users || users.length === 0) return;
      const pill = document.createElement("button");
      pill.type = "button";
      pill.className = "reaction-pill" + (users.includes(username) ? " mine" : "");
      pill.textContent = `${emoji} ${users.length}`;
      pill.title = users.join(", ");
      pill.addEventListener("click", () => sendReaction(messageId, emoji));
      container.appendChild(pill);
    });
  }

  // ---------- message formatting: links, line breaks, code ----------
  // All user text is HTML-escaped first; the handful of tags below are the
  // only markup ever introduced, and only around content that has already
  // been escaped — never from raw, un-escaped user input.
  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function linkify(escapedText) {
    return escapedText.replace(/(https?:\/\/[^\s<]+)|(\bwww\.[^\s<]+\.[^\s<]+)/gi, (match) => {
      let trail = "";
      while (match.length && /[),.:;!?'"]/.test(match[match.length - 1])) {
        trail = match[match.length - 1] + trail;
        match = match.slice(0, -1);
      }
      if (!match) return trail;
      const href = /^https?:\/\//i.test(match) ? match : `https://${match}`;
      return `<a href="${href}" target="_blank" rel="noopener noreferrer nofollow">${match}</a>${trail}`;
    });
  }

  function renderMessageBody(rawText) {
    const escaped = escapeHtml(rawText);

    // Pull code out first so its contents never get linkified or have their
    // newlines turned into <br>.
    const codeBlocks = [];
    let working = escaped.replace(/```([\s\S]*?)```/g, (_, code) => {
      codeBlocks.push(code.replace(/^\n/, ""));
      return `\u0000B${codeBlocks.length - 1}\u0000`;
    });
    const codeSpans = [];
    working = working.replace(/`([^`\n]+)`/g, (_, code) => {
      codeSpans.push(code);
      return `\u0000S${codeSpans.length - 1}\u0000`;
    });

    working = linkify(working).replace(/\n/g, "<br>");

    working = working.replace(/\u0000S(\d+)\u0000/g, (_, i) => `<span class="inline-code">${codeSpans[i]}</span>`);
    working = working.replace(/\u0000B(\d+)\u0000/g, (_, i) => `<span class="code-block">${codeBlocks[i]}</span>`);
    return working;
  }

  // ---------- jump-to-latest ----------
  let unseenCount = 0;

  function isNearBottom() {
    return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  }

  function showJumpButton() {
    jumpCountEl.textContent = unseenCount > 0 ? String(unseenCount) : "";
    jumpBtn.classList.add("show");
  }

  function hideJumpButton() {
    jumpBtn.classList.remove("show");
    unseenCount = 0;
  }

  log.addEventListener("scroll", () => {
    if (isNearBottom()) hideJumpButton();
  });

  jumpBtn.addEventListener("click", () => {
    log.scrollTop = log.scrollHeight;
    hideJumpButton();
  });

  // ---------- unread tab badge + sound ----------
  let soundEnabled = true;
  try { soundEnabled = localStorage.getItem("chat-sound") !== "off"; } catch (_) {}

  function setSoundEnabled(on) {
    soundEnabled = on;
    soundToggleBtn.classList.toggle("on", on);
    soundToggleBtn.setAttribute("aria-checked", String(on));
    try { localStorage.setItem("chat-sound", on ? "on" : "off"); } catch (_) {}
  }
  setSoundEnabled(soundEnabled);
  soundToggleBtn.addEventListener("click", () => setSoundEnabled(!soundEnabled));

  let audioCtx = null;
  function playPing() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(660, now + 0.15);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.4);
    } catch (_) {}
  }

  let unreadTabCount = 0;

  function clearUnreadBadge() {
    unreadTabCount = 0;
    document.title = BASE_TITLE;
  }

  function notifyNewMessage(who, text) {
    if (document.hidden) {
      unreadTabCount += 1;
      document.title = `(${unreadTabCount}) ${BASE_TITLE}`;
      if (soundEnabled) playPing();
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) clearUnreadBadge();
  });
  window.addEventListener("focus", clearUnreadBadge);

  function appendMessage(kind, who, text, colorKey, isoTimestamp, messageId) {
    const wasNearBottom = isNearBottom();
    const wrap = document.createElement("div");
    const groupKey = kind === "them" || kind === "me" ? (colorKey || who) : null;
    const atMs = isoTimestamp ? new Date(isoTimestamp).getTime() : Date.now();
    const grouped = !!(
      groupKey &&
      lastRenderedMsgMeta &&
      lastRenderedMsgMeta.kind === kind &&
      lastRenderedMsgMeta.key === groupKey &&
      atMs - lastRenderedMsgMeta.atMs < GROUP_WINDOW_MS
    );

    wrap.className = "msg " + kind + (grouped ? " grouped" : "");

    if (kind === "system") {
      wrap.innerHTML = `<div class="bubble"></div>`;
      wrap.querySelector(".bubble").textContent = text;
      lastRenderedMsgMeta = null; // a system notice always breaks a grouping run
    } else {
      const color = colorForUser(colorKey || who);
      const whoHtml = grouped ? "" : `<div class="who"></div>`;
      const bodyHtml =
        whoHtml +
        `<div class="bubble-wrap"><div class="bubble"></div><button type="button" class="react-trigger" aria-label="Add reaction">🙂</button></div>` +
        `<div class="reactions"></div><div class="meta"></div>`;

      if (kind === "them") {
        const avatarHtml = grouped ? "" : `<span class="avatar"></span>`;
        wrap.innerHTML = `<div class="avatar-slot">${avatarHtml}</div><div class="msg-col">${bodyHtml}</div>`;
        if (!grouped) {
          const avatarEl = wrap.querySelector(".avatar");
          avatarEl.style.background = `linear-gradient(135deg, ${color.from}, ${color.to})`;
          avatarEl.textContent = (colorKey || who).slice(0, 2).toUpperCase();
        }
      } else {
        wrap.innerHTML = bodyHtml;
      }

      if (!grouped) {
        const whoEl = wrap.querySelector(".who");
        whoEl.textContent = who;
        whoEl.style.backgroundImage = `linear-gradient(90deg, ${color.from}, ${color.to})`;
      }
      const bubbleEl = wrap.querySelector(".bubble");
      bubbleEl.innerHTML = renderMessageBody(text);
      bubbleEl.style.background = color.tint;
      bubbleEl.style.borderColor = color.from;
      bubbleEl.style.boxShadow = `0 4px 20px ${color.glow}`;
      wrap.querySelector(".meta").textContent = formatTime(new Date(atMs));
      lastRenderedMsgMeta = { kind, key: groupKey, atMs };

      if (messageId) {
        wrap.dataset.messageId = messageId;
        messageElements.set(messageId, wrap);
        wrap.querySelector(".react-trigger").addEventListener("click", (e) => {
          e.stopPropagation();
          openReactionPicker(e.currentTarget, messageId);
        });
      }
    }
    log.appendChild(wrap);

    if (kind === "me" || wasNearBottom) {
      log.scrollTop = log.scrollHeight;
      hideJumpButton();
    } else if (kind === "them") {
      unseenCount += 1;
      showJumpButton();
    }

    if (kind === "them") notifyNewMessage(who, text);
  }

  // ---------- online users panel ----------
  let onlineUsers = new Set();

  function renderOnlineList() {
    const count = onlineUsers.size;
    onlineCountBadge.textContent = String(count);
    onlineCountBadge.hidden = count === 0;
    onlinePanelCount.textContent = String(count);

    const names = Array.from(onlineUsers).sort((a, b) => {
      if (a === username) return -1;
      if (b === username) return 1;
      return a.localeCompare(b);
    });

    onlineListEl.innerHTML = "";
    if (names.length === 0) {
      onlineListEl.innerHTML = `<li class="online-empty">No one online</li>`;
      return;
    }
    names.forEach((name) => {
      const color = colorForUser(name);
      const li = document.createElement("li");
      li.className = "online-item";
      li.innerHTML = `<span class="online-avatar"></span><span class="online-name"></span>`;
      const avatar = li.querySelector(".online-avatar");
      avatar.style.background = `linear-gradient(135deg, ${color.from}, ${color.to})`;
      avatar.textContent = name.slice(0, 2).toUpperCase();
      li.querySelector(".online-name").textContent = name;
      if (name === username) {
        const you = document.createElement("span");
        you.className = "online-you";
        you.textContent = "you";
        li.appendChild(you);
      }
      onlineListEl.appendChild(li);
    });
  }

  function setOnlineUsers(list) {
    onlineUsers = new Set(list || []);
    renderOnlineList();
  }

  function setStatus(state) {
    statusDot.className = "status-dot " + state;
  }

  function wsUrl(room, user) {
    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    return `${proto}//${window.location.host}/ws/${encodeURIComponent(room)}/${encodeURIComponent(user)}`;
  }

  // ---------- typing indicator ----------
  const typingUsers = new Map(); // username -> timeout id
  const TYPING_HOLD_MS = 3000;
  const TYPING_SEND_THROTTLE_MS = 1500;
  let lastTypingSentAt = 0;

  function renderTypingIndicator() {
    const names = Array.from(typingUsers.keys());
    if (names.length === 0) {
      typingIndicator.classList.remove("show");
      return;
    }
    let text;
    if (names.length === 1) text = `${names[0]} is typing`;
    else if (names.length === 2) text = `${names[0]} and ${names[1]} are typing`;
    else text = `${names.length} people are typing`;
    typingTextEl.textContent = text;
    typingIndicator.classList.add("show");
  }

  function markUserTyping(name) {
    if (!name || name === username) return;
    clearTimeout(typingUsers.get(name));
    const timeoutId = setTimeout(() => {
      typingUsers.delete(name);
      renderTypingIndicator();
    }, TYPING_HOLD_MS);
    typingUsers.set(name, timeoutId);
    renderTypingIndicator();
  }

  function clearUserTyping(name) {
    if (!typingUsers.has(name)) return;
    clearTimeout(typingUsers.get(name));
    typingUsers.delete(name);
    renderTypingIndicator();
  }

  messageInput.addEventListener("input", () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (messageInput.value.trim() === "") return;
    const now = Date.now();
    if (now - lastTypingSentAt < TYPING_SEND_THROTTLE_MS) return;
    lastTypingSentAt = now;
    ws.send(JSON.stringify({ type: "typing" }));
  });

  // ---------- composer: auto-grow + Enter to send, Shift+Enter for a newline ----------
  function autoGrowMessageInput() {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + "px";
  }
  messageInput.addEventListener("input", autoGrowMessageInput);

  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendRow.requestSubmit();
    }
  });

  // ---------- session persistence ----------
  // The socket itself dies with the page, so on refresh we remember who was
  // in which room and transparently rejoin. sessionStorage is per-tab, so
  // two tabs can still be two different users, and it's cleared on Leave.
  const SESSION_KEY = "chat-session";

  function saveSession(room, user) {
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ room, user })); } catch (_) {}
  }

  function clearSession() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
  }

  function loadSession() {
    try {
      const saved = JSON.parse(sessionStorage.getItem(SESSION_KEY));
      return saved && saved.room && saved.user ? saved : null;
    } catch (_) {
      return null;
    }
  }

  // ---------- best-effort "name already taken" warning ----------
  // Purely informational: the server doesn't enforce unique usernames (that
  // would break the same-user-reconnecting-after-a-refresh handling), so
  // this never blocks submission — it just warns before you connect.
  let nameCheckTimer = null;

  function showNameWarning(user, room) {
    nameTakenText.textContent = `"${user}" is already in #${room} — you can still continue, or pick another name.`;
    nameTakenWarning.hidden = false;
  }

  function hideNameWarning() {
    nameTakenWarning.hidden = true;
  }

  async function checkNameTaken() {
    const user = usernameInput.value.trim();
    const room = roomInput.value.trim();
    if (!user || !room) { hideNameWarning(); return; }
    try {
      const res = await fetch(`/api/rooms/${encodeURIComponent(room)}/users`);
      if (!res.ok) { hideNameWarning(); return; }
      const data = await res.json();
      const taken = (data.users || []).some((n) => n.toLowerCase() === user.toLowerCase());
      if (taken) showNameWarning(user, room); else hideNameWarning();
    } catch (_) {
      hideNameWarning(); // offline/unreachable — don't block on a soft check
    }
  }

  function debouncedCheckNameTaken() {
    clearTimeout(nameCheckTimer);
    nameCheckTimer = setTimeout(checkNameTaken, 400);
  }

  usernameInput.addEventListener("input", debouncedCheckNameTaken);
  roomInput.addEventListener("input", debouncedCheckNameTaken);
  usernameInput.addEventListener("blur", checkNameTaken);

  joinForm.addEventListener("submit", (e) => {
    e.preventDefault();
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    const user = usernameInput.value.trim();
    const room = roomInput.value.trim();
    if (!user || !room) return;
    hideNameWarning();
    reconnectAttempts = 0;
    connect(room, user);
  });

  // ---------- auto-reconnect ----------
  function showReconnectBanner(attempt) {
    reconnectText.textContent =
      attempt <= 1 ? "Connection lost — reconnecting…" : `Still trying to reconnect… (attempt ${attempt})`;
    reconnectBanner.classList.add("show");
  }

  function hideReconnectBanner() {
    reconnectBanner.classList.remove("show");
  }

  function scheduleReconnect() {
    if (reconnectTimer || !currentRoom || !username) return;
    reconnectAttempts += 1;
    showReconnectBanner(reconnectAttempts);
    const delay = Math.min(1000 * 2 ** (reconnectAttempts - 1), 15000);
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connect(currentRoom, username);
    }, delay);
  }

  reconnectRetryBtn.addEventListener("click", () => {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (!currentRoom || !username) return;
    connect(currentRoom, username);
  });

  function connect(room, user) {
    username = user;
    currentRoom = room;
    const url = wsUrl(room, username);
    logEvent("info", `new WebSocket("${url}")`);
    logEvent("info", "readyState 0 CONNECTING — sending HTTP GET with Upgrade: websocket");
    setStatus("connecting");

    ws = new WebSocket(url);

    ws.onopen = () => {
      logEvent("open", "readyState 1 OPEN — server replied 101 Switching Protocols, handshake complete");
      setStatus("open");
      reconnectAttempts = 0;
      hideReconnectBanner();
      saveSession(room, username);
      joinScreen.style.display = "none";
      chatScreen.style.display = "flex";
      leaveBtn.classList.add("show");
      onlineBtn.classList.add("show");
      headerTitle.innerHTML = `<span class="room-name">#${room}</span> as ${username}`;
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === "typing") {
        markUserTyping(data.username);
        return;
      }
      if (data.type === "reaction_update") {
        const el = messageElements.get(data.message_id);
        if (el) renderReactions(el, data.reactions);
        return;
      }
      if (data.type === "roster") {
        logEvent("recv", `roster: ${data.message}`);
        maybeInsertDayDivider(data.timestamp);
        appendMessage("system", null, `${data.message} · ${data.users_online} online`);
        setOnlineUsers([...(data.users || []), username]);
      } else if (data.type === "system") {
        logEvent("recv", `system: ${data.message}`);
        maybeInsertDayDivider(data.timestamp);
        appendMessage("system", null, `${data.message} · ${data.users_online} online`);
        clearUserTyping(data.message.split(" ")[0]);
        if (Array.isArray(data.users)) setOnlineUsers(data.users);
      } else {
        logEvent("recv", `message from ${data.username}: ${data.message}`);
        clearUserTyping(data.username);
        maybeInsertDayDivider(data.timestamp);
        const mine = data.username === username;
        appendMessage(mine ? "me" : "them", mine ? "You" : data.username, data.message, data.username, data.timestamp, data.id);
      }
    };

    ws.onclose = (event) => {
      logEvent("close", `readyState 3 CLOSED — code ${event.code}${event.reason ? " (" + event.reason + ")" : ""}`);
      setStatus("closed");

      if (leaving) {
        leaveBtn.classList.remove("show");
        onlineBtn.classList.remove("show");
        leaving = false;
        reconnectAttempts = 0;
        hideReconnectBanner();
        log.innerHTML = "";
        resetLogState();
        closeAllReactionPickers();
        messageElements.clear();
        hideJumpButton();
        clearUnreadBadge();
        typingUsers.forEach((id) => clearTimeout(id));
        typingUsers.clear();
        renderTypingIndicator();
        onlineUsers.clear();
        renderOnlineList();
        chatScreen.style.display = "none";
        joinScreen.style.display = "flex";
        headerTitle.textContent = "WebSocket Chat";
        return;
      }

      // Unexpected drop (server restart, network blip, Render cold-sleep) —
      // keep the chat screen and log as-is and try to rejoin automatically.
      scheduleReconnect();
    };

    ws.onerror = () => {
      logEvent("error", "WebSocket error event fired");
      setStatus("closed");
    };
  }

  leaveBtn.addEventListener("click", () => {
    if (!ws || leaving) return;
    leaving = true;
    clearSession();
    logEvent("info", "Leave clicked — ws.close(1000, \"left the room\")");
    ws.close(1000, "left the room");
  });

  sendRow.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    const payload = JSON.stringify({ message: text });
    ws.send(payload);
    logEvent("send", `ws.send(${payload})`);
    messageInput.value = "";
    autoGrowMessageInput();
    lastTypingSentAt = 0;
  });

  // Rejoin automatically after a refresh; otherwise just prefill the form.
  const savedSession = loadSession();
  if (savedSession) {
    usernameInput.value = savedSession.user;
    roomInput.value = savedSession.room;
    logEvent("info", `restoring session: ${savedSession.user} in #${savedSession.room}`);
    connect(savedSession.room, savedSession.user);
  }
</script>
</body>
</html>
