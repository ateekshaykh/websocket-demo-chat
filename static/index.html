<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0d1117" />
<title>WebSocket Chat</title>
<style>
  :root {
    --canvas: #0d1117;
    --canvas-subtle: #161b22;
    --canvas-inset: #010409;
    --border: #30363d;
    --border-muted: #21262d;
    --fg: #e6edf3;
    --fg-muted: #8b949e;
    --fg-subtle: #6e7681;
    --accent: #58a6ff;
    --accent-emphasis: #1f6feb;
    --success: #3fb950;
    --success-emphasis: #238636;
    --danger: #f85149;
    --attention: #d29922;
    --radius: 6px;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--canvas);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 16px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.7rem 0.9rem;
    padding-top: max(0.7rem, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border-muted);
    background: var(--canvas-subtle);
  }

  header h1 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  header h1 .room-name { color: var(--accent); }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--fg-subtle);
    flex: 0 0 auto;
    box-shadow: 0 0 0 3px transparent;
    transition: background .2s;
  }
  .status-dot.connecting { background: var(--attention); box-shadow: 0 0 0 3px rgba(210,153,34,.15); animation: pulse 1s infinite; }
  .status-dot.open { background: var(--success); box-shadow: 0 0 0 3px rgba(63,185,80,.15); }
  .status-dot.closed { background: var(--danger); box-shadow: 0 0 0 3px rgba(248,81,73,.15); }
  @keyframes pulse { 50% { opacity: .4; } }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-muted);
    border-radius: var(--radius);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 0.85rem;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .icon-btn:active { background: var(--border-muted); }

  .leave-btn {
    display: none;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: var(--radius);
    height: 36px;
    padding: 0 0.7rem;
    font-family: var(--sans);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .leave-btn.show { display: flex; }
  .leave-btn:active { background: rgba(248,81,73,.15); }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Join screen ---------- */
  #join-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 1.5rem;
    gap: 1rem;
    max-width: 420px;
    margin: 0 auto;
    width: 100%;
  }
  #join-screen p.lede { color: var(--fg-muted); font-size: 0.9rem; margin: -0.5rem 0 0.5rem; }
  .field { display: flex; flex-direction: column; gap: 0.35rem; }
  .field label { font-size: 0.8rem; color: var(--fg-muted); }
  input[type="text"] {
    background: var(--canvas-inset);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: var(--radius);
    padding: 0.65rem 0.75rem;
    font-size: 16px;
    font-family: var(--sans);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.15); }

  button.primary {
    background: var(--success-emphasis);
    border: 1px solid rgba(240,246,252,.1);
    color: #fff;
    border-radius: var(--radius);
    padding: 0.7rem 1rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:active { background: #2ea043; }

  /* ---------- Chat screen ---------- */
  #chat-screen {
    flex: 1;
    min-height: 0;
    display: none;
    flex-direction: column;
  }

  #log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .msg { max-width: 85%; display: flex; flex-direction: column; gap: 0.15rem; }
  .msg .bubble {
    background: var(--canvas-subtle);
    border: 1px solid var(--border-muted);
    border-left-width: 3px;
    border-radius: var(--radius);
    padding: 0.5rem 0.7rem;
    font-size: 0.92rem;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .msg .who { font-size: 0.72rem; color: var(--fg-muted); padding: 0 0.15rem; }
  .msg.me { align-self: flex-end; }
  .msg.system { align-self: center; max-width: 95%; }
  .msg.system .bubble {
    background: transparent;
    border: none;
    color: var(--fg-subtle);
    font-size: 0.78rem;
    font-family: var(--mono);
    text-align: center;
    padding: 0.2rem;
  }

  #send-row {
    flex: 0 0 auto;
    display: flex;
    gap: 0.5rem;
    padding: 0.6rem;
    padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border-muted);
    background: var(--canvas-subtle);
  }
  #send-row input {
    flex: 1;
    background: var(--canvas-inset);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: var(--radius);
    padding: 0.65rem 0.8rem;
    font-size: 16px;
    outline: none;
  }
  #send-row input:focus { border-color: var(--accent); }
  #send-row button {
    background: var(--success-emphasis);
    border: none;
    color: #fff;
    border-radius: var(--radius);
    padding: 0 1.1rem;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }

  /* ---------- Connection log panel ---------- */
  #panel-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(1,4,9,.6);
    z-index: 10;
  }
  #panel {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 82dvh;
    background: var(--canvas);
    border-top: 1px solid var(--border);
    border-radius: 12px 12px 0 0;
    z-index: 11;
    flex-direction: column;
    box-shadow: 0 -8px 30px rgba(0,0,0,.5);
  }
  #panel.show, #panel-backdrop.show { display: flex; }
  #panel-backdrop.show { display: block; }

  #panel-handle {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.7rem 0.9rem;
    border-bottom: 1px solid var(--border-muted);
  }
  #panel-handle h2 { font-size: 0.9rem; margin: 0; }

  #panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0.9rem; }

  #event-log { font-family: var(--mono); font-size: 0.76rem; line-height: 1.6; }
  .ev { padding: 0.2rem 0; border-bottom: 1px solid var(--border-muted); display: flex; gap: 0.5rem; }
  .ev .t { color: var(--fg-subtle); flex: 0 0 auto; }
  .ev .m { flex: 1; word-break: break-word; }
  .ev.info .m { color: var(--fg-muted); }
  .ev.open .m { color: var(--success); }
  .ev.send .m { color: var(--accent); }
  .ev.recv .m { color: var(--fg); }
  .ev.error .m, .ev.close .m { color: var(--danger); }
</style>
</head>
<body>

<header>
  <span id="status-dot" class="status-dot"></span>
  <h1 id="header-title">WebSocket Chat</h1>
  <button id="leave-btn" class="leave-btn" title="Leave room" aria-label="Leave room">Leave</button>
  <button id="open-panel" class="icon-btn" title="Connection log" aria-label="Connection log">{ }</button>
</header>

<main>
  <section id="join-screen">
    <div>
      <h1 style="font-size:1.3rem;margin:0 0 0.2rem;">Join a room</h1><br>
      <p class="lede">Pick a name and room. Anyone using this page or the Python client with the same room name lands in the same chat.</p>
    </div>
    <form id="join-form">
      <div class="field">
        <label for="username">Your name</label>
        <input type="text" id="username" placeholder="e.g. alice" required autocomplete="off" />
      </div>
      <div class="field" style="margin-top:0.75rem;">
        <label for="room">Room name</label>
        <input type="text" id="room" placeholder="general" value="general" required autocomplete="off" />
      </div>
      <button type="submit" class="primary" style="margin-top:1rem;width:100%;">Connect</button>
    </form>
  </section>

  <section id="chat-screen">
    <div id="log"></div>
    <form id="send-row">
      <input id="message" placeholder="Message" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </section>
</main>

<div id="panel-backdrop"></div>
<div id="panel">
  <div id="panel-handle">
    <h2>Connection log</h2>
    <button id="close-panel" class="icon-btn" aria-label="Close">✕</button>
  </div>
  <div id="panel-body">
    <div id="event-log"></div>
  </div>
</div>

<script>
  const joinForm = document.getElementById("join-form");
  const joinScreen = document.getElementById("join-screen");
  const chatScreen = document.getElementById("chat-screen");
  const headerTitle = document.getElementById("header-title");
  const statusDot = document.getElementById("status-dot");
  const log = document.getElementById("log");
  const sendRow = document.getElementById("send-row");
  const messageInput = document.getElementById("message");
  const leaveBtn = document.getElementById("leave-btn");

  const panel = document.getElementById("panel");
  const panelBackdrop = document.getElementById("panel-backdrop");
  const openPanelBtn = document.getElementById("open-panel");
  const closePanelBtn = document.getElementById("close-panel");
  const eventLogEl = document.getElementById("event-log");

  let ws = null;
  let username = "";
  let leaving = false;

  // ---------- connection log helpers ----------
  function nowLabel() {
    const d = new Date();
    return d.toTimeString().split(" ")[0] + "." + String(d.getMilliseconds()).padStart(3, "0");
  }

  function logEvent(cls, text) {
    const row = document.createElement("div");
    row.className = "ev " + cls;
    row.innerHTML = `<span class="t">${nowLabel()}</span><span class="m"></span>`;
    row.querySelector(".m").textContent = text;
    eventLogEl.appendChild(row);
    eventLogEl.scrollTop = eventLogEl.scrollHeight;
  }

  openPanelBtn.addEventListener("click", () => { panel.classList.add("show"); panelBackdrop.classList.add("show"); });
  closePanelBtn.addEventListener("click", () => { panel.classList.remove("show"); panelBackdrop.classList.remove("show"); });
  panelBackdrop.addEventListener("click", () => { panel.classList.remove("show"); panelBackdrop.classList.remove("show"); });

  // ---------- chat ----------
  // GitHub's Primer dark-theme accent palette — the same hues GitHub uses
  // for labels/mentions. Each username deterministically hashes to one of
  // these so a given name always renders in the same color for everyone.
  // `bg` is the same hue as a low-opacity tint, used behind that user's bubbles.
  const USER_COLORS = [
    { fg: "#58a6ff", bg: "rgba(88, 166, 255, 0.14)" },  // blue
    { fg: "#3fb950", bg: "rgba(63, 185, 80, 0.14)" },   // green
    { fg: "#d29922", bg: "rgba(210, 153, 34, 0.14)" },  // yellow
    { fg: "#f85149", bg: "rgba(248, 81, 73, 0.14)" },   // red
    { fg: "#bc8cff", bg: "rgba(188, 140, 255, 0.14)" }, // purple
    { fg: "#db61a2", bg: "rgba(219, 97, 162, 0.14)" },  // pink
    { fg: "#39c5cf", bg: "rgba(57, 197, 207, 0.14)" },  // cyan
    { fg: "#ffa657", bg: "rgba(255, 166, 87, 0.14)" },  // orange
  ];

  function colorForUser(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
      hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    }
    return USER_COLORS[hash % USER_COLORS.length];
  }

  function appendMessage(kind, who, text, colorKey) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + kind;
    if (kind === "system") {
      wrap.innerHTML = `<div class="bubble"></div>`;
      wrap.querySelector(".bubble").textContent = text;
    } else {
      wrap.innerHTML = `<div class="who"></div><div class="bubble"></div>`;
      const color = colorForUser(colorKey || who);
      const whoEl = wrap.querySelector(".who");
      whoEl.textContent = who;
      whoEl.style.color = color.fg;
      const bubbleEl = wrap.querySelector(".bubble");
      bubbleEl.textContent = text;
      bubbleEl.style.background = color.bg;
      bubbleEl.style.borderColor = color.fg;
    }
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function setStatus(state) {
    statusDot.className = "status-dot " + state;
  }

  function wsUrl(room, user) {
    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    return `${proto}//${window.location.host}/ws/${encodeURIComponent(room)}/${encodeURIComponent(user)}`;
  }

  joinForm.addEventListener("submit", (e) => {
    e.preventDefault();
    username = document.getElementById("username").value.trim();
    const room = document.getElementById("room").value.trim();
    if (!username || !room) return;

    const url = wsUrl(room, username);
    logEvent("info", `new WebSocket("${url}")`);
    logEvent("info", "readyState 0 CONNECTING — sending HTTP GET with Upgrade: websocket");
    setStatus("connecting");

    ws = new WebSocket(url);

    ws.onopen = () => {
      logEvent("open", "readyState 1 OPEN — server replied 101 Switching Protocols, handshake complete");
      setStatus("open");
      joinScreen.style.display = "none";
      chatScreen.style.display = "flex";
      leaveBtn.classList.add("show");
      headerTitle.innerHTML = `<span class="room-name">#${room}</span> as ${username}`;
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === "system") {
        logEvent("recv", `system: ${data.message}`);
        appendMessage("system", null, `${data.message} · ${data.users_online} online`);
      } else {
        logEvent("recv", `message from ${data.username}: ${data.message}`);
        const mine = data.username === username;
        appendMessage(mine ? "me" : "them", mine ? "You" : data.username, data.message, data.username);
      }
    };

    ws.onclose = (event) => {
      logEvent("close", `readyState 3 CLOSED — code ${event.code}${event.reason ? " (" + event.reason + ")" : ""}`);
      setStatus("closed");
      leaveBtn.classList.remove("show");
      leaving = false;
      log.innerHTML = "";
      chatScreen.style.display = "none";
      joinScreen.style.display = "flex";
      headerTitle.textContent = "WebSocket Chat";
    };

    ws.onerror = () => {
      logEvent("error", "WebSocket error event fired");
      setStatus("closed");
    };
  });

  leaveBtn.addEventListener("click", () => {
    if (!ws || leaving) return;
    leaving = true;
    logEvent("info", "Leave clicked — ws.close(1000, \"left the room\")");
    ws.close(1000, "left the room");
  });

  sendRow.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    const payload = JSON.stringify({ message: text });
    ws.send(payload);
    logEvent("send", `ws.send(${payload})`);
    messageInput.value = "";
  });
</script>
</body>
</html>
